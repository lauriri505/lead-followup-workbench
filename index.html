<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="AutoCava 用户与购车意向跟进工作台"><title>线索跟进工作台</title><link rel="stylesheet" href="workbench.css?v=20261012-5"></head>
<body>
<nav class="utility-bar" aria-label="应用导航"><a href="admin.html" data-ui="管理员后台">管理员后台</a><label><span data-ui="界面语言">界面语言</span><select id="languageSelect"><option value="zh-CN">中文</option><option value="es-MX">Español (México)</option></select></label><span id="salesperson"></span></nav>
<main class="page-shell" id="workbench">
<header class="page-heading"><div><p class="eyebrow">LEAD FOLLOW-UP</p><div class="title-line"><h1 data-ui="线索跟进工作台">线索跟进工作台</h1><span class="muted caption" id="todayTaskCount"></span></div><p class="subtitle" data-ui="集中管理普通线索信息、跟进动作与客户沟通上下文">集中管理普通线索信息、跟进动作与客户沟通上下文</p></div><div class="actions"><button id="reportButton" data-ui="购车报告">购车报告</button><button class="primary" id="submitTopButton" data-ui="提交并进入下一条">提交并进入下一条</button></div></header>
<section class="task-banner" aria-labelledby="taskTitle"><span class="task-icon"><img src="assets/figma-workbench/arrow-right.svg" alt="" width="24" height="24"></span><div><div class="task-kicker"><span data-ui="我的当前任务">我的当前任务</span><span class="pill" id="taskStatus"></span></div><h2 id="taskTitle"></h2></div><div class="task-id"><span data-ui="任务 ID">任务 ID</span><strong id="taskId"></strong></div></section>
<div class="workspace-grid"><div class="workbench-left">
<section class="card user-panel" aria-labelledby="userTitle">
<header class="user-card-heading"><h2 id="userTitle" data-ui="用户信息">用户信息</h2><span id="leadId"></span><button id="editUserButton" data-ui="编辑用户信息">编辑用户信息</button></header>
<div class="user-identity"><span id="userAvatar" aria-hidden="true"></span><div><strong id="userName"></strong><p id="userPhone"></p></div></div>
<dl class="user-summary"><div><dt data-ui="预计购车时间（UTC-6）">预计购车时间（UTC-6）</dt><dd id="purchaseDate"></dd></div><div><dt data-ui="用户所在城市">用户所在城市</dt><dd id="userCity"></dd></div></dl>
<p class="other-intentions"><span data-ui="其他留资车辆">其他留资车辆</span>：<span id="otherVehicles"></span></p>
<div id="intentRows"></div>
</section>
<section class="card follow-panel" aria-labelledby="followTitle"><div class="section-heading"><h2 id="followTitle" data-ui="本次跟进">本次跟进</h2><span class="pill" id="taskGroup"></span></div><p id="followState" class="caption muted"></p><fieldset><legend><span class="required" data-ui="跟进结果">跟进结果</span><span class="required"> *</span><span class="muted caption" data-ui="单选">单选</span></legend><div id="resultList" class="result-list"></div></fieldset><div id="conditionalFields"></div><label class="note-label" for="followNote" data-ui="跟进记事">跟进记事</label><textarea id="followNote" rows="3" data-placeholder="补充本次沟通情况（选填）"></textarea><button type="button" id="submitFollowButton" class="primary" data-ui="提交跟进">提交跟进</button><p id="followError" class="error" role="alert" hidden></p></section>
</div><aside class="card activity-panel"><div class="tabs" role="tablist"><button id="operationsTab" role="tab" data-tab="operations" aria-controls="recordPanel" aria-selected="true" data-ui="操作记录">操作记录</button><button id="editsTab" role="tab" data-tab="edits" aria-controls="recordPanel" aria-selected="false"><span data-ui="编辑记录">编辑记录</span><span id="editCount"></span></button><button id="notesTab" role="tab" data-tab="notes" aria-controls="recordPanel" aria-selected="false"><span data-ui="跟进记事">跟进记事</span><span id="noteCount"></span></button></div><section id="recordPanel" role="tabpanel" aria-labelledby="operationsTab"></section></aside></div>
<details class="demo-tools"><summary data-ui="待售卖线索（本地演示）">待售卖线索（本地演示）</summary><div id="saleLeadTable"></div></details>
</main>
<dialog id="editor" class="editor" aria-labelledby="editorTitle"><form id="editorForm"><header class="dialog-heading"><h2 id="editorTitle"></h2><button type="button" class="icon-button" id="closeEditor" aria-label="关闭"><img src="assets/figma-workbench/close.svg" width="20" height="20" alt=""></button></header><div id="editorBody"></div><p class="error" id="editorError" role="alert" hidden></p><footer class="dialog-actions"><button type="button" id="cancelEditor" data-ui="取消">取消</button><button class="primary" type="submit" id="saveEditor" data-ui="保存">保存</button></footer></form></dialog>
<dialog id="discardDialog" class="confirm-dialog" aria-labelledby="discardTitle"><h2 id="discardTitle" data-ui="放弃本次修改？">放弃本次修改？</h2><p data-ui="当前内容尚未保存，关闭后将丢失本次修改。">当前内容尚未保存，关闭后将丢失本次修改。</p><div class="dialog-actions"><button id="keepEditing" data-ui="继续编辑">继续编辑</button><button id="discardChanges" class="primary" data-ui="放弃修改">放弃修改</button></div></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="flow-config.js?v=20261012-5"></script><script src="data.js?v=20261012-5"></script><script src="config-table.js?v=20261012-5"></script><script src="workbench-config.js?v=20261012-5"></script><script src="workbench-core.js?v=20261012-5"></script><script src="workbench-flow.js?v=20261012-5"></script><script src="workbench.js?v=20261012-5"></script>
</body></html>
